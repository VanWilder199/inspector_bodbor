# nginx для Mini App подборщика (BOT-04, раздел 4.5 плана).
#
# SPA живёт на app.site.by. Правила кеша (gotcha 2):
#   - index.html — БЕЗ кеша: после деплоя пользователи сразу получают свежую версию
#   - ассеты с хешами (/assets/*-<hash>.*) — долгий кеш: содержимое иммutable, перезапросов нет
# /api/ проксируется на бэкенд api:8080.

server {
    listen 80;
    server_name app.site.by _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: /reports/<id>/section/<key> и прочие глубокие пути отдают index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ассеты с хешами — годовой кеш, без валидации на каждый запрос
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Сам index.html — без кеша
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # Остальное (favicon и т.п.) — короткий кеш
    location ~* \.(?:ico|png|svg|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Прокси на бэкенд: путь /api/ переписывается в корень api:8080 (бэкенд живёт без /api)
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}